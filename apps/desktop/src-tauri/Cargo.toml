[package]
name = "luma"
version = "0.16.0"
description = "A lightweight cross-platform terminal and SSH client"
authors = ["Luma contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-ios-glass-tabbar = { path = "vendor/tauri-plugin-ios-glass-tabbar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "process",
  "io-util",
  "fs",
  "time",
] }
russh-sftp = "2.3"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
zeroize = "1"
ssh-key = { version = "0.6.7", default-features = false, features = [
  "std",
  "encryption",
  "ed25519",
  "rsa",
  # PuTTY keys are commonly ECDSA, and enabling the curves also lets the
  # keychain accept pasted ECDSA keys everywhere else.
  "p256",
  "p384",
  "p521",
] }
rsa = { version = "0.9.8", features = ["pkcs5"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
pkcs8 = { version = "0.10.2", features = ["encryption", "pem"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
  "json",
] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
regex = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
# Managed-vault key sealing: the same ECDH-P256-HKDF-SHA256-AES-256-GCM envelope
# the collaboration client uses for room keys, implemented here so a vault
# content key never crosses into JS.
p256 = { version = "0.13", default-features = false, features = [
  "ecdh",
  "pkcs8",
  "std",
] }
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
fs2 = "0.4"
# PuTTY .ppk decoding: SHA-1 based key derivation and HMAC for format 2,
# AES-256-CBC for the encrypted private section of both formats. Format 3's
# Argon2 derivation reuses the argon2 dependency above.
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Loopback MCP endpoint. hyper/hyper-util/http-body-util/bytes are already in
# the tree via reqwest, so enabling the server side adds no new crates; a
# routing framework would, for a single POST path. Desktop-only: the mobile
# shell has nothing to serve and no way to keep a listener alive.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
portable-pty = "0.9"
# CI: requires libudev-dev on Linux
serialport = "4"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  # PuTTY keeps its saved sessions in HKCU, not in a config file.
  "Win32_System_Registry",
  # Only for SECURITY_ATTRIBUTES in RegCreateKeyExW's signature, which the
  # registry enumeration test needs to build its own key.
  "Win32_Security",
] }
